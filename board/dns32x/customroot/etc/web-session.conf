# Alt-F web login sessions. This is the one place to change them.
# Sourced by the web pages as shell, so keep the NAME=value form.
# After editing, use "Save settings" in the web pages so the change survives a reboot.
# New values apply immediately, no restart needed.

# Seconds of inactivity before you have to sign in again (28800 = 8 hours).
# Every click or page load resets this clock.
SESSION_IDLE=28800

# Longest a session can last, no matter how active you are (604800 = 7 days).
# Also the lifetime of the cookie when "Keep me signed in on this device" is ticked.
SESSION_ABS=604800

# yes: a session only works from the address that signed in (safer).
# no: allow the session to follow you if your address changes (for example switching
# between Wi-Fi and a phone connection).
SESSION_BIND_IP=yes
